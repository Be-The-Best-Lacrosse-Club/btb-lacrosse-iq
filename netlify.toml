[build]
  publish = "."
  command = "echo 'No build step required'"

[functions]
  directory = "netlify/functions"

[functions."analyze-video"]
  timeout = 60

[[edge_functions]]
  function = "save-moments"
  path = "/api/save-moments"

[[edge_functions]]
  function = "search-moments"
  path = "/api/search-moments"

[[edge_functions]]
  function = "list-games"
  path = "/api/list-games"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://*.bethebestli.com https://btb-os.netlify.app http://localhost:*"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  command = "npx serve ."
  port = 8888
  targetPort = 3000
