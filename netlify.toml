[build]
  publish = "."
  command = "echo 'No build step required'"

# Keep these: /api/analyze-video is LIVE in production (deployed 2026-06-15) but
# its source is gitignored via netlify/functions/ and is not in this repo, so
# the only surviving copy is the deployed bundle on Netlify. Dropping the
# directory declaration or the 60s timeout would break it on the next deploy.
# TODO: recover the source from Netlify, commit it, and un-ignore the directory.
[functions]
  directory = "netlify/functions"

[functions."analyze-video"]
  timeout = 60

[[edge_functions]]
  function = "save-moments"
  path = "/api/save-moments"

[[edge_functions]]
  function = "search-moments"
  path = "/api/search-moments"

[[edge_functions]]
  function = "list-games"
  path = "/api/list-games"

# No blanket CORS header for /api/* — a static "*" here would re-open what the
# edge functions are deliberately restricting. Each function sets its own
# Access-Control-Allow-Origin from its allowlist.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://*.bethebestli.com https://btb-os.netlify.app http://localhost:*"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  command = "npx serve ."
  port = 8888
  targetPort = 3000
